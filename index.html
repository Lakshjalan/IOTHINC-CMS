<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IOTHINC — IoT & Innovation Club at VIT Chennai. Embedded systems, web development, and competitive engineering under one roof." />
    <meta name="theme-color" content="#0A0A0C" />

    <!--
      Preconnect to critical third-party origins.
      crossorigin is required for fonts (CORS fetch).
      Do NOT add crossorigin for non-CORS origins like supabase API calls.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Optimised font load: only the weights actually used in the app.
      display=swap prevents FOIT (invisible text during font load).
      Removed Syne/Plus Jakarta Sans — app uses Space Grotesk as fallback via CSS.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols — stripped to only the single axis config actually rendered -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />

    <title>IOTHINC - VIT Chennai IoT Club</title>

    <!-- Synchronous theme application — prevents light→dark FOUC -->
    <script>
      try {
        const saved = localStorage.getItem('theme');
        const prefersDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-background text-on-background">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
